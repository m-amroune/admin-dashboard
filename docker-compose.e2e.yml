services:
  postgres-e2e:
    image: postgres:16-alpine
    container_name: admin-dashboard-e2e-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: e2e_password
      POSTGRES_DB: admin_dashboard_e2e

    ports:
      - "5433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d admin_dashboard_e2e"]
      interval: 5s
      timeout: 5s
      retries: 10