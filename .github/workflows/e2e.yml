name: E2E Tests

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: true
      DATABASE_URL: postgresql://postgres:e2e_password@localhost:5432/admin_dashboard_e2e
      AUTH_SECRET: admin-dashboard-e2e-secret-ci-2026

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: e2e_password
          POSTGRES_DB: admin_dashboard_e2e

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d admin_dashboard_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npm run test:e2e:ci

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          